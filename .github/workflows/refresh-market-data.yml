name: Refresh market data

# The site has no backend: prices and bank rates are baked into the repo and
# served as static files. This job is what keeps them current.
#
# Running the fetch here rather than in a visitor's browser is the whole point —
# one scheduled run costs ~200 requests total instead of ~200 per visitor.
#
# Prices come from Alpha Vantage. Yahoo blanket-blocks datacenter IPs (a runner
# gets 429 on request #1), and Twelve Data's free tier is US-only and charges for
# the dividend record, which would mean price return instead of total return for
# most of the universe.
#
# Alpha Vantage allows ~25 calls a day, so the universe rotates rather than
# refreshing whole — a full cycle every ~10 days. That is fine here: each
# symbol's *entire* history is stored on first fetch and committed, so the
# rotation only ever ages the current month.

on:
  schedule:
    # 05:20 UTC daily. Monthly closes only change once a month, but the current
    # month's bar moves daily, so a daily refresh keeps "today" honest.
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated symbols to refresh (blank = the whole universe)'
        required: false
        type: string
      interval:
        description: 'Minimum ms between API calls'
        required: false
        default: '1000'
        type: string
      budget:
        description: 'How many symbols to refresh this run'
        required: false
        default: '16'
        type: string

# Never let two refreshes race for the same commit.
concurrency:
  group: refresh-market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: the script is dependency-free ESM on purpose, so this
      # job cannot break on an unrelated dependency bump.
      # Alpha Vantage's daily quota is shared between mapping and fetching, so
      # only a few symbols are mapped per run. This is a no-op once the whole
      # universe is resolved.
      - name: Map any symbols still missing a provider id
        continue-on-error: true
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: node scripts/map-alphavantage.mjs --limit 6 --write

      - name: Fetch prices and ECB rates
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          if [ -z "$ALPHAVANTAGE_API_KEY" ]; then
            echo "::error::ALPHAVANTAGE_API_KEY secret is not set."
            exit 1
          fi
          node scripts/fetch-market-data.mjs \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            --interval ${{ inputs.interval || '1000' }} \
            --budget ${{ inputs.budget || '16' }}

      - name: Commit refreshed data
        id: commit
        run: |
          if [ -z "$(git status --porcelain public/data data-source)" ]; then
            echo "No change in public/data — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data-source
          git commit -m "Refresh market data ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the
  # deploy is called explicitly rather than left to the push trigger.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
