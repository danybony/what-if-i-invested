name: Deploy to GitHub Pages

# Builds the static export and publishes it.
#
# Requires Pages to be enabled for the repository with "Source: GitHub Actions"
# (Settings → Pages). On a private repository that also needs a plan which
# includes Pages for private repos.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh-market-data.yml once new data lands.
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch head rather than the triggering SHA. When
      # refresh-market-data.yml calls this workflow, the commit it just made is
      # newer than the SHA that started the run — checking out that SHA would
      # rebuild the tree from *before* the data landed, and publish stale data.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      # No NEXT_PUBLIC_BASE_PATH: this repo has its own custom domain
      # (public/CNAME), so the site is served from the root rather than the
      # /<repo>/ subpath a project site would otherwise use.
      #
      # The measurement ID is a repository *variable*, not a secret: it is
      # visible in every page's source by design. Leaving it unset simply
      # builds a site with no analytics, which is what a local or forked
      # build should get.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      # Pages serves the artifact as-is; without this, /_next/* 404s because
      # Jekyll skips underscore-prefixed directories.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
